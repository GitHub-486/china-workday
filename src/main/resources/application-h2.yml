spring:
  datasource:
    url: jdbc:h2:file:${H2_DB_DIR:./data}/china-workday;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=YEAR
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      schema-locations: classpath:db/schema-h2.sql
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console
      ##JDBC URL填写：jdbc:h2:file:./data/china-workday;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=YEAR
china-workday:
  crawl:
    enabled: ${CHINA_WORKDAY_CRAWL_ENABLED:true}
    on-startup: ${CHINA_WORKDAY_CRAWL_ON_STARTUP:true}
    cron: ${CHINA_WORKDAY_CRAWL_CRON:0 0 8 * * *}
