server:
  servlet:
    context-path: /workday

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://rushi-postgres:5432/${DB_NAME:rushi}}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

china-workday:
  crawl:
    enabled: ${CHINA_WORKDAY_CRAWL_ENABLED:-true}
    on-startup: ${CHINA_WORKDAY_CRAWL_ON_STARTUP:-true}
    cron: ${CHINA_WORKDAY_CRAWL_CRON:-0 0 8 * * *}
