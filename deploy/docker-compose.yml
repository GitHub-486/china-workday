version: "3.8"

services:
  holiday-postgres:
    image: postgres:16-alpine
    container_name: holiday-postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
    env_file:
      - .env
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      #- china-workday-pg-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$${DB_ADMIN_USER}\" -d \"$${DB_NAME}\" && psql -U \"$${DB_ADMIN_USER}\" -d \"$${DB_NAME}\" -tAc 'SELECT 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10

  china-workday:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: china-workday:1.0.2
    container_name: china-workday
    restart: unless-stopped
    depends_on:
      holiday-postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_URL: jdbc:postgresql://holiday-postgres:5432/${DB_NAME}
      CHINA_WORKDAY_API_TOKEN: ${CHINA_WORKDAY_API_TOKEN:?must be set}
      CHINA_WORKDAY_CRAWL_ENABLED: ${CHINA_WORKDAY_CRAWL_ENABLED:-true}
      CHINA_WORKDAY_CRAWL_ON_STARTUP: ${CHINA_WORKDAY_CRAWL_ON_STARTUP:-true}
      CHINA_WORKDAY_CRAWL_CRON: ${CHINA_WORKDAY_CRAWL_CRON:-0 0 8 * * *}
    ports:
      - "8081:8080"

volumes:
  china-workday-pg-data:
    driver: local
